[[end]]
type = "sys_info"
format = ["  {cpu_percent:<3.2}%"]
[end.interval]
cpu = 1

[[end]]
type = "sys_info"
format = ["  {memory_used:<3.2}G"]
[end.interval]
memory = 1

[[end]]
type = "volume"
format = "{icon} {percentage}%"
max_volume = 100
truncate = "middle"

[end.icons]
volume_high = ""
volume_medium = ""
volume_low = ""
muted = ""

[[end]]
type = "tray"
