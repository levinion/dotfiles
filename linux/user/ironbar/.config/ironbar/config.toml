position = "top"

[[start]]
type = "label"
class = "workspace"
label = "#workspace"
show_if = "#workspace"

[[start]]
type = "label"
class = "app_id"
label = "#app_id"
show_if = "#app_id"

[[start]]
type = "label"
class = "app_title"
label = "#title"
show_if = "#title"
[start.truncate]
mode = "end"
max_length = 30

[[center]]
format = "  %H:%M "
type = "clock"

[[end]]
type = "label"
class = "recording"
label = "#recording"
show_if = "#recording"

# [[end]]
